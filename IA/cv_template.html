<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');

    @page {
      size: A4;
      margin: 0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #1a1a2e;
      font-size: 15pt;
      line-height: 1.5;
    }

    html, body { height: 100%; }

    .page {
      width: 210mm;
      height: 297mm;
      display: grid;
      grid-template-columns: 68mm 1fr;
      align-items: stretch; /* ensure columns stretch vertically */
    }

    .sidebar {
      background: #0f1b3d;
      color: #e8eaf0;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      height: 100%;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f8ef7, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28pt;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 8px;
      letter-spacing: -1px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name-block { text-align: center; }
    .name-block h1 {
      font-family: 'Playfair Display', serif;
      font-size: 18pt;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .name-block .title {
      font-size: 10pt;
      color: #a0aec8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    .sidebar-section h3 {
      font-size: 9pt;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4f8ef7;
      border-bottom: 1px solid #1e2f5a;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 10pt;
      color: #c8d0e0;
    }
    .contact-icon {
      width: 16px;
      text-align: center;
      color: #4f8ef7;
    }

    .skills-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .skill-item { }
    .skill-name {
      font-size: 10pt;
      color: #c8d0e0;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }
    .skill-bar {
      height: 5px;
      background: #1e2f5a;
      border-radius: 2px;
      overflow: hidden;
    }
    .skill-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f8ef7, #a78bfa);
      border-radius: 2px;
    }

    .lang-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .lang-name { font-size: 8.5pt; color: #c8d0e0; }
    .lang-level {
      font-size: 9pt;
      color: #4f8ef7;
      background: #1e2f5a;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .interest-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-size: 9pt;
      background: #1e2f5a;
      color: #a0aec8;
      padding: 3px 8px;
      border-radius: 10px;
    }

    .main {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 18pt;
      font-weight: bold;
      color: #0f1b3d;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e8edf8;
      position: relative;
    }
    .section h2::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 36px;
      height: 4px;
      background: #4f8ef7;
    }

    .summary {
      font-size: 12pt;
      color: #4a5568;
      line-height: 1.65;
      background: #f7f9ff;
      border-left: 3px solid #4f8ef7;
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
    }

    .offer-match {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 8px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 8.5pt;
      color: #78350f;
      margin-bottom: 16px;
    }
    .offer-match strong { color: #b45309; }

    .experience-item {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #e8edf8;
    }
    .experience-item:last-child { border-bottom: none; margin-bottom: 0; }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 3px;
    }
    .exp-title {
      font-weight: 600;
      font-size: 9.5pt;
      color: #1a1a2e;
    }
    .exp-date {
      font-size: 10pt;
      color: #4f8ef7;
      white-space: nowrap;
      margin-left: 8px;
    }
    .exp-company {
      font-size: 10pt;
      color: #718096;
      margin-bottom: 5px;
    }
    .exp-company span {
      color: #a78bfa;
      font-weight: 500;
    }

    .exp-bullets {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .exp-bullets li {
      font-size: 10pt;
      color: #4a5568;
      padding-left: 12px;
      position: relative;
    }
    .exp-bullets li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: #4f8ef7;
      font-size: 7pt;
      top: 1px;
    }

    .edu-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .edu-degree {
      font-weight: 600;
      font-size: 9pt;
      color: #1a1a2e;
    }
    .edu-school { font-size: 8.5pt; color: #718096; margin-top: 1px; }
    .edu-date { font-size: 8pt; color: #4f8ef7; white-space: nowrap; }
  </style>
</head>
<body>
<div class="page">

  <aside class="sidebar">

    <div>
      <div class="avatar">{{INITIALES}}</div>
      <div class="name-block">
        <h1>{{PRENOM}}<br></h1>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Contact</h3>
      <div class="contact-item">
        <span class="contact-icon">✉</span>
        <span>{{EMAIL}}</span>
      </div>
      <div class="contact-item">
        <span class="contact-icon">☎</span>
        <span>{{TELEPHONE}}</span>
      </div>
      <div class="contact-item">
        <span class="contact-icon">⌂</span>
        <span>{{VILLE}}</span>
      </div>
      <div class="contact-item">
        <span class="contact-icon">in</span>
        <span>{{LINKEDIN}}</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Compétences</h3>
      <div class="skills-list">
        {{SKILLS}}
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Langues</h3>
      {{LANGUES}}
    </div>

    <div class="sidebar-section">
      <h3>Centres d'intérêt</h3>
      <div class="interest-tags">
        {{INTERETS}}
      </div>
    </div>

  </aside>

  <main class="main">

    <section class="section">
      <h2>Profil</h2>
      <p class="summary">{{SUMMARY}}</p>
    </section>

    <div class="offer-match">
      <strong>✦ Pourquoi ce poste ?</strong> — {{OFFER_MATCH}}
    </div>

    <section class="section">
      <h2>Expériences</h2>
      {{EXPERIENCES}}
    </section>

    <section class="section">
      <h2>Formation</h2>
      {{FORMATIONS}}
    </section>

  </main>
</div>
</body>
</html>
